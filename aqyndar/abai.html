<h1>Абай Құнанбайұлы</h1>
<p><b>Өмір сүрген жылдары:</b> 1845–1904<br>
<b>Туған жері:</b> Шыңғыстау, <a href="../qalalar/semei.html">Семей</a> өңірі</p>
<p>Қазақ жазба әдебиетінің негізін қалаушы, ақын, ағартушы, аудармашы.</p>

</ul>
